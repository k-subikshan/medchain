<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medical 404 Page</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}
body{
display:flex;justify-content:center;align-items:center;height:100vh;
background:linear-gradient(135deg,#eef9ff,#d9f3ff);overflow:hidden}
.bg span{position:absolute;border-radius:50%;background:#7dd3fc22;animation:float 8s infinite ease-in-out}
.bg span:nth-child(1){width:220px;height:220px;left:-60px;top:-60px}
.bg span:nth-child(2){width:180px;height:180px;right:-60px;bottom:-40px;animation-delay:2s}
.card{
width:920px;max-width:92%;background:#fff;border-radius:24px;
box-shadow:0 20px 60px rgba(0,0,0,.08);
display:flex;align-items:center;justify-content:space-between;
padding:55px;position:relative;z-index:2}
.left{width:52%}
.badge{display:inline-block;background:#e0f2fe;color:#0284c7;padding:8px 16px;border-radius:20px;font-weight:600}
h2.big{font-size:120px;color:#0284c7;line-height:1}
h1{font-size:34px;color:#0f172a;margin:10px 0}
p{color:#64748b;line-height:1.8}
.btns{margin-top:28px}
a.btn{text-decoration:none;padding:14px 24px;border-radius:40px;font-weight:600;margin-right:12px;display:inline-block;transition:.3s}
.primary{background:#0284c7;color:#fff}
.secondary{border:2px solid #0284c7;color:#0284c7}
.btn:hover{transform:translateY(-4px)}
.right{width:40%;text-align:center;position:relative}
.doc{font-size:170px;animation:bob 3s infinite ease-in-out}
.icons{position:absolute;inset:0}
.icons span{position:absolute;font-size:30px;animation:orbit 4s infinite ease-in-out}
.icons span:nth-child(1){top:5%;left:15%}
.icons span:nth-child(2){top:20%;right:10%;animation-delay:1s}
.icons span:nth-child(3){bottom:18%;left:10%;animation-delay:2s}
.icons span:nth-child(4){bottom:8%;right:12%;animation-delay:3s}
.heartbeat{margin-top:10px;width:260px;margin-left:auto;margin-right:auto}
.heartbeat svg{width:100%;height:70px}
.heartbeat path{
fill:none;
stroke:#06b6d4;
stroke-width:4;
stroke-linecap:round;
stroke-linejoin:round;
stroke-dasharray:700;
stroke-dashoffset:700;
animation:ecg 2.2s linear infinite;
filter:drop-shadow(0 0 8px #06b6d4)}
.heartbeat{position:relative}
.heartbeat:after{
content:"";position:absolute;top:0;left:-20%;width:20%;height:100%;
background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);
animation:scan 2.2s linear infinite}
@keyframes ecg{to{stroke-dashoffset:0}}
@keyframes scan{from{left:-20%}to{left:100%}}
@keyframes float{50%{transform:translateY(-25px)}}
@keyframes bob{50%{transform:translateY(-12px)}}
@keyframes orbit{50%{transform:translateY(-10px) rotate(15deg)}}
@media(max-width:768px){
.card{flex-direction:column-reverse;text-align:center;padding:35px}
.left,.right{width:100%}
h2.big{font-size:90px}
.btn{display:block;margin:10px auto}
}
</style>
</head>
<body>
<div class="bg"><span></span><span></span></div>

<div class="card">
<div class="left">
<div class="badge">🏥 Medical Center</div>
<h2 class="big">404</h2>
<h1>Oops! This Page Needs a Check-up</h1>
<p>The page you're looking for may have been moved, deleted, or never existed.</p>

<div class="btns">
<a href="/" class="btn primary">Back Home</a>
<a href="/contact" class="btn secondary">Contact Us</a>
</div>
</div>

<div class="right">
<div class="icons">
<span>💊</span>
<span>🩺</span>
<span>❤️</span>
<span>➕</span>
</div>

<div class="doc">👨‍⚕️</div>

<div class="heartbeat">
<svg viewBox="0 0 500 80" preserveAspectRatio="none">
<path d="M0 40 L60 40 L80 40 L95 20 L110 60 L125 10 L140 40 L220 40 L235 25 L250 55 L265 15 L280 40 L500 40"/>
</svg>
</div>

</div>
</div>

</body>
</html>
