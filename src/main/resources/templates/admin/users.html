<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/admin/base}"><head><title>User Management | MedChain</title></head><body><h2 layout:fragment="page-title">User Management</h2><section class="content" layout:fragment="content"><div class="hero"><h1>User Management</h1><p>Registered application accounts from MySQL.</p></div><div class="card table-wrap"><table><tr><th>Username</th><th>Name</th><th>Role</th><th>Email</th><th>Phone</th></tr><tr th:if="${#lists.isEmpty(users)}"><td colspan="5">No users found.</td></tr><tr th:each="u : ${users}"><td th:text="${u.username}">username</td><td th:text="${u.name}">name</td><td th:text="${u.roles}">role</td><td th:text="${u.email != null ? u.email : '-'}">-</td><td th:text="${u.phone != null ? u.phone : '-'}">-</td></tr></table></div></section></body></html>
