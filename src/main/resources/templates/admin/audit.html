<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/admin/base}"><head><title>Audit History | MedChain</title></head><body><h2 layout:fragment="page-title">Audit History</h2><section class="content" layout:fragment="content"><div class="hero"><h1>Audit & Transaction History</h1><p>Blockchain events generated by actual medicine, batch and prescription operations.</p></div><div class="card"><div class="list"><div class="list-item" th:each="block : ${blocks}"><strong th:text="${block.recordType + ' record anchored'}">Record anchored</strong><small th:text="${'Block ' + block.blockIndex + ' • ' + block.recordId + ' • ' + block.timestamp}">Block</small><span class="badge ok">Verified</span></div><div class="list-item" th:if="${#lists.isEmpty(blocks)}">No blockchain transactions recorded yet.</div></div></div></section></body></html>
