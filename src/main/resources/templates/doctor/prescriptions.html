<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/doctor/base}"><head><title>Prescriptions | MedChain</title></head><body><section class="content" layout:fragment="content"><div class="hero"><h1>Prescription Management</h1><p>Review prescriptions and validate those requiring a second-doctor check.</p></div><div class="card" th:if="${validationResult}"><b th:text="${validationResult}">VALIDATED</b></div><div class="card"><a class="btn" th:href="@{/doctor/pending-validations}">Open Pending Validations</a></div><div class="card table-wrap"><table><tr><th>Prescription ID</th><th>Patient</th><th>Medicine</th><th>Total</th><th>Dispensed</th><th>Remaining</th><th>Status</th><th>Action</th></tr><tr th:if="${#lists.isEmpty(prescriptions)}"><td colspan="8">No prescriptions found.</td></tr><tr th:each="p : ${prescriptions}"><td th:text="${p.prescriptionId}">RX</td><td th:text="${p.patientId + ' — ' + p.patientName}">Patient</td><td th:text="${p.medicineName}">Medicine</td><td th:text="${p.quantity}">0</td><td th:text="${p.dispensedQuantity != null ? p.dispensedQuantity : 0}">0</td><td th:text="${p.quantity - (p.dispensedQuantity != null ? p.dispensedQuantity : 0)}">0</td><td><span class="badge" th:text="${p.status}" th:classappend="${p.status == 'ACTIVE' ? ' ok' : ' bad'}">ACTIVE</span></td><td><form th:if="${p.status == 'PENDING_VALIDATION'}" th:action="@{'/doctor/prescriptions/' + p.prescriptionId + '/validate'}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn" type="submit">Validate</button></form><span th:if="${p.status != 'PENDING_VALIDATION'}" class="muted" th:text="${p.validatorUsername != null ? 'Validated by ' + p.validatorUsername : 'No validation required'}">-</span></td></tr></table></div></section></body></html>
