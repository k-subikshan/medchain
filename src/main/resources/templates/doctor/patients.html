<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/doctor/base}"><head><title>Patients | MedChain</title></head><body><section class="content" layout:fragment="content"><div class="hero"><h1>My Patients</h1><p>Patient records associated with prescriptions in the database.</p></div><div class="card table-wrap"><table><tr><th>Patient ID</th><th>Name</th><th>Medicine</th><th>Prescription</th><th>Status</th></tr><tr th:if="${#lists.isEmpty(prescriptions)}"><td colspan="5">No patient records found.</td></tr><tr th:each="p : ${prescriptions}"><td th:text="${p.patientId}">ID</td><td th:text="${p.patientName}">Name</td><td th:text="${p.medicineName}">Medicine</td><td th:text="${p.prescriptionId}">RX</td><td><span class="badge ok" th:text="${p.status}">ACTIVE</span></td></tr></table></div></section></body></html>
