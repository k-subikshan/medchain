<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Batch Management | MedChain</title><link rel="stylesheet" href="/css/style.css"></head><body><div class="app"><aside class="sidebar"><div class="brand"><div class="logo">MC</div>MedChain</div><nav class="nav"><a th:href="@{/manufacturer/dashboard}">Dashboard</a><a th:href="@{/manufacturer/medicine-registration}">Medicine Registration</a><a class="active" th:href="@{/manufacturer/batch-management}">Batch Management</a></nav></aside><main class="main"><header class="topbar"><div><h2>Batch Management</h2></div></header><section class="content"><div class="hero"><h1>Create Medicine Batch</h1><p>Create a batch for an existing medicine. The batch hash is anchored automatically.</p></div><div class="card"><form method="post" action="/manufacturer/batch-management"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="form-grid"><div class="field"><label>Batch ID</label><input name="batchId" required placeholder="B-2026-001"></div><div class="field"><label>Medicine ID</label><select name="medicineId" required><option value="">Select medicine</option><option th:each="m : ${medicines}" th:value="${m.medicineId}" th:text="${m.medicineId + ' — ' + m.name}">MED</option></select></div><div class="field"><label>Package Count</label><input name="packageCount" type="number" min="1" required></div><div class="field"><label>Manufacturing Date</label><input name="manufacturingDate" type="date" required></div></div><button class="btn" type="submit">Create Batch</button><p th:if="${success}" th:text="${success}" class="badge ok"></p></form></div><div class="section-head"><h2>Stored Batches</h2></div><div class="card table-wrap"><table><tr><th>Batch ID</th><th>Medicine ID</th><th>Packages</th><th>Manufacturing Date</th><th>Hash</th></tr><tr th:if="${#lists.isEmpty(batches)}"><td colspan="5">No batches created yet.</td></tr><tr th:each="b : ${batches}"><td th:text="${b.batchId}">ID</td><td th:text="${b.medicineId}">MED</td><td th:text="${b.packageCount}">0</td><td th:text="${b.manufacturingDate}">Date</td><td class="hash" th:text="${b.recordHash}">hash</td></tr></table></div></section></main></div></body></html>
