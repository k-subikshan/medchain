<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Medicine Registration | MedChain</title><link rel="stylesheet" href="/css/style.css"></head>
<body><div class="app"><aside class="sidebar"><div class="brand"><div class="logo">MC</div>MedChain</div>
<nav class="nav"><a class="" th:href="@{/manufacturer/dashboard}">Dashboard</a><a class="active" th:href="@{/manufacturer/medicine-registration}">Medicine Registration</a><a class="" th:href="@{/manufacturer/batch-management}">Batch Management</a></nav><div class="profile"><div class="avatar">M</div><div><b>Manufacturer</b><small>Portal</small></div></div></aside>
<main class="main"><header class="topbar"><div><button class="icon-btn menu-toggle" onclick="toggleMenu()">☰</button><h2>Medicine Registration</h2></div><div class="top-actions"><button class="icon-btn" onclick="toast('No new notifications')">🔔</button><div class="user-menu"><button class="user-btn" onclick="toggleUserMenu()"><div class="avatar">A</div><div class="usertext"><b>Manufacturer</b><small>Manufacturer Portal</small></div><span>⌄</span></button><div class="user-dropdown" id="userDropdown"><a th:href="@{/manufacturer/dashboard}">👤 Profile</a><a th:href="@{/manufacturer/dashboard}">⚙ Settings</a><div class="dropdown-divider"></div><button onclick="logout()">↪ Logout</button></div></div></div></header>
<section class="content">
<div class="hero"><h1>Register Medicine</h1><p>Create the medicine master record. Backend will store data in MySQL and anchor its hash on Ethereum.</p></div>
<div class="card"><form method="post" action="/manufacturer/medicine-registration"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="form-grid"><div class="field"><label>Manufacturer ID</label><input name="manufacturerId" required placeholder="MFG-001"></div><div class="field"><label>Medicine ID</label><input name="medicineId" required placeholder="MED-001"></div><div class="field"><label>Medicine Name</label><input name="name" required placeholder="Amoxicillin 500mg"></div><div class="field"><label>Dosage Form</label><select name="dosageForm"><option>Tablet</option><option>Capsule</option><option>Syrup</option></select></div><div class="field"><label>Manufacturing Date</label><input name="manufacturingDate" type="date" required></div><div class="field"><label>Expiry Date</label><input name="expiryDate" type="date" required></div></div><div class="field"><label>Medicine Details</label><textarea name="details" placeholder="Composition, storage instructions, etc."></textarea></div><button class="btn" type="submit">Register & Anchor Hash</button><p th:if="${success}" th:text="${success}" class="badge ok"></p></form></div>
</section></main></div><div class="modal-bg"><div class="modal"></div></div><div class="toast"></div><script src="/js/script.js"></script></body></html>
